server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Assets con hash de contenido (main.[hash].js, chunks, css): el nombre
    # cambia en cada build, asi que se pueden cachear para siempre. Match mas
    # especifico que "location /", por lo que gana para /static/*.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker: NUNCA cachear. El navegador debe re-chequear /sw.js en
    # cada arranque para detectar una version nueva y auto-actualizar la PWA.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # App shell + rutas de React Router. try_files sirve index.html como
    # fallback de cualquier ruta (/pda, /wms, ...). Se marca no-cache para que
    # los dispositivos (iPad/PDA) reciban el bundle nuevo apenas se publica en
    # vez de quedarse pegados a un index.html cacheado que apunta al JS viejo.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
