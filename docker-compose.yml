version: '3.8'

services:
  backend:
    build: ./backend
    container_name: mos_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Sin valor por defecto A PROPOSITO. Aqui vivia la cadena completa, con
      # usuario root, en un repo publico: el default es exactamente como se
      # filtro. Si la variable no esta, compose falla y se nota; un default
      # silencioso no se nota hasta que alguien lo lee en GitHub.
      - MONGODB_URL=${MONGODB_URL:?define MONGODB_URL en el entorno o en un .env local}
      - JWT_SECRET=${JWT_SECRET:?define JWT_SECRET en el entorno o en un .env local}

  frontend:
    build: ./frontend
    container_name: mos_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
